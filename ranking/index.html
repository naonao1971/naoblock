    <main>
      <section class="ranking wrap ranking-page" aria-label="総合ランキング（全員）">
        <div id="board"><p class="board-msg">読み込み中...</p></div>

    <script type="module">
      // 総合ランキング（sakuya-kit）。読み込めなかったときはメッセージだけ出す。
      const board = document.getElementById("board");
      import("https://cdn.jsdelivr.net/gh/naonao1971/sakuya-kit@0.2.0/kit.js")
        .then(({ mountOverallRanking }) => {
          mountOverallRanking(board, {
            gasUrl: "https://script.google.com/macros/s/AKfycby-UoKAfHw4eBULVb37tQzwPEhNm65B_HUktd9Sh0ZxMdOdmnRHdub0NeeXUCAqg8bG/exec",
            limit: 10000, // 全員
            cnp: false, // CNPアイコン（救出キャラの一覧）は出さない
            title: "🏆 総合ランキング（全員）",
          });
        })
        .catch((e) => {
          console.error(e);
          board.innerHTML = '<p class="board-msg">ランキングを読み込めませんでした。</p>';
        });
    </script>
  </body>
